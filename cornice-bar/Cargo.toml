[package]
name = "cornice-bar"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A Hyprland status bar on wlr-layer-shell: workspaces, cava visualiser, system tray and a waybar-style widget strip"
repository = "https://github.com/aasb13/cornice"
license = "MIT"
readme = "../README.md"
keywords = ["wayland", "status-bar", "hyprland", "layer-shell"]
categories = ["gui"]

[dependencies]
anyhow = "1.0.104"
calloop = { version = "0.14.4", features = ["signals"] }
calloop-wayland-source = "0.4.1"
clap = { version = "4.6.6", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.33"
nix = { version = "0.31", features = ["signal", "process"] }
cornice-config = { path = "../cornice-config", version = "0.1.0" }
rusttype = "0.9.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["full"] }
system-tray = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = "0.4"
hyprland = "0.4.0-beta.3"
smithay-client-toolkit = "0.20.0"
wayland-client = "0.31.15"
wayland-protocols = "0.32"
