[package]
name = "cornice-config"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Config loading, commented-template generation and live reload shared by the cornice binaries"
repository = "https://github.com/aasb13/cornice"
license = "MIT"
readme = "../README.md"
keywords = ["configuration", "toml", "reload", "wayland", "x11"]
categories = ["config"]

[dependencies]
anyhow = "1.0.104"
dirs = "6.0"
log = "0.4.33"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }
