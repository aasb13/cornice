[package]
name = "cornice"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A minimal wallpaper platform for Wayland and X11: a layer-shell background surface (or an X11 background window) plus a pluggable frame source"
repository = "https://github.com/aasb13/cornice"
license = "MIT"
readme = "../README.md"
keywords = ["wayland", "x11", "wallpaper", "layer-shell", "hyprland"]
categories = ["gui"]

[dependencies]
anyhow = "1.0.104"
calloop = { version = "0.14.4", features = ["signals"] }
calloop-wayland-source = "0.4.1"
clap = { version = "4.6.6", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.33"
nix = { version = "0.31", features = ["signal", "process"] }
cornice-config = { path = "../cornice-config", version = "0.1.0" }
rusttype = "0.9.3"
serde = { version = "1", features = ["derive"] }
smithay-client-toolkit = "0.20.0"
toml = "0.8"
wayland-client = "0.31.15"
x11rb = { version = "0.14", features = ["randr"] }
